<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LD Tienda Express</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111111;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <!-- Iframe con tu enlace web oficial de Google Apps Script (que termina en /exec) -->
    <iframe id="tiendaFrame" src="https://script.google.com/macros/s/AKfycbyc9b2wQ-3qj_K5d0k5.../exec" allow="clipboard-write"></iframe>

    <script>
        // Script inteligente para capturar parámetros de GitHub y enviarlos al iframe
        window.addEventListener('DOMContentLoaded', () => {
            const queryString = window.location.search;
            if (queryString) {
                const iframe = document.getElementById('tiendaFrame');
                const baseUrl = iframe.getAttribute('src');
                // Añade los parámetros de la URL al Apps Script de forma dinámica
                iframe.setAttribute('src', baseUrl + queryString);
            }
        });
    </script>
</body>
</html>
